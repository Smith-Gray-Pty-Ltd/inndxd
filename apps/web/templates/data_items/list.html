{% extends "base.html" %}
{% block title %}Data Items — Inndxd{% endblock %}
{% block page_title %}Data Items{% endblock %}
{% block content %}

<div class="card bg-base-100 shadow-sm mb-6">
    <div class="card-body">
        <form hx-get="/ui/data-items/rows"
              hx-trigger="change from:select"
              hx-target="#data-item-rows"
              hx-swap="innerHTML"
              class="flex gap-4 items-end flex-wrap">
            <fieldset class="fieldset">
                <label class="fieldset-label">Project</label>
                <select name="project_id" class="select select-sm">
                    <option value="">All projects</option>
                    {% for project in projects %}
                    <option value="{{ project.id }}" {% if current_project == project.id|string %}selected{% endif %}>
                        {{ project.name }}
                    </option>
                    {% endfor %}
                </select>
            </fieldset>
            <fieldset class="fieldset">
                <label class="fieldset-label">Brief</label>
                <select name="brief_id" class="select select-sm">
                    <option value="">All briefs</option>
                    {% for brief in all_briefs %}
                    <option value="{{ brief.id }}" {% if current_brief == brief.id|string %}selected{% endif %}>
                        {{ brief.natural_language[:50] }}{% if brief.natural_language|length > 50 %}...{% endif %}
                    </option>
                    {% endfor %}
                </select>
            </fieldset>
            <fieldset class="fieldset">
                <label class="fieldset-label">Sort</label>
                <div class="join">
                    <select name="sort" class="select select-sm join-item">
                        <option value="created_at" {% if sort == 'created_at' %}selected{% endif %}>Date</option>
                        <option value="content_type" {% if sort == 'content_type' %}selected{% endif %}>Type</option>
                    </select>
                    <select name="order" class="select select-sm join-item">
                        <option value="desc" {% if order == 'desc' %}selected{% endif %}>Newest</option>
                        <option value="asc" {% if order == 'asc' %}selected{% endif %}>Oldest</option>
                    </select>
                </div>
            </fieldset>
        </form>
    </div>
</div>

<div class="bg-base-100 rounded-box shadow-sm overflow-hidden">
    <table class="table">
        <thead>
            <tr>
                <th>Type</th>
                <th>Data</th>
                <th>Source</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody id="data-item-rows" hx-get="/ui/data-items/rows?project_id={{ current_project }}&brief_id={{ current_brief }}&sort={{ sort }}&order={{ order }}" hx-trigger="load" hx-swap="innerHTML">
            <tr><td colspan="4" class="text-center py-8"><span class="loading loading-spinner loading-lg"></span></td></tr>
        </tbody>
    </table>
</div>

{% endblock %}
