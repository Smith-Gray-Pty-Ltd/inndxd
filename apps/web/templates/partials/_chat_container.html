<div class="flex flex-col h-full max-h-screen">
    <div class="flex-1 overflow-y-auto p-4 space-y-4" id="chat-messages">
        {% for msg in messages %}
        {% with role=msg.role, content=msg.content, timestamp=msg.timestamp, avatar=msg.avatar %}
        {% include 'partials/_chat_message.html' %}
        {% endwith %}
        {% endfor %}

        <div id="chat-loading" class="hidden">
            <div class="chat chat-start">
                <div class="chat-image avatar">
                    <div class="w-10 rounded-full bg-neutral text-neutral-content flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M2 5a2 2 0 012-2h12a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2V5zm3.293 1.293a1 1 0 011.414 0l3.293 3.293 3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
                    </div>
                </div>
                <div class="chat-bubble">
                    <span class="loading loading-dots loading-md"></span>
                </div>
            </div>
        </div>
    </div>

    <div id="chat-connection-status" class="flex items-center justify-center py-1">
        <span class="inline-flex items-center gap-1 text-xs opacity-50">
            <span class="w-1.5 h-1.5 rounded-full bg-success inline-block"
                  id="sse-dot"></span>
            <span id="sse-status-text">{{ status_text|default('Ready') }}</span>
        </span>
    </div>

    {% include 'partials/_chat_input.html' %}
</div>

<script>
(function() {
    var container = document.getElementById('chat-messages');
    if (container) {
        container.scrollTop = container.scrollHeight;
        new MutationObserver(function() {
            container.scrollTop = container.scrollHeight;
        }).observe(container, { childList: true, subtree: true });
    }

    var sseDot = document.getElementById('sse-dot');
    var sseText = document.getElementById('sse-status-text');
    if (sseDot && sseText && typeof EventSource !== 'undefined') {
        var source = new EventSource('{{ sse_url|default("/ui/chat/stream") }}');
        source.onopen = function() {
            sseDot.className = 'w-1.5 h-1.5 rounded-full bg-success inline-block';
            sseText.textContent = 'Connected';
        };
        source.onerror = function() {
            sseDot.className = 'w-1.5 h-1.5 rounded-full bg-error inline-block';
            sseText.textContent = 'Disconnected';
        };
    }
})();
</script>
