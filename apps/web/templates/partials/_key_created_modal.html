<div class="alert alert-success mb-4">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    <div>
        <p class="font-medium">Key Created: {{ key_name }}</p>
        <p class="text-sm opacity-80">Prefix: <code class="bg-base-200 px-1 rounded text-xs">{{ key_prefix }}</code></p>
    </div>
</div>

<div class="card bg-base-100 shadow-sm mb-4">
    <div class="card-body p-4">
        <div class="flex items-center gap-2">
            <input type="text" id="raw-key-{{ key_id }}" value="{{ raw_key }}" readonly
                   class="input input-bordered input-sm flex-1 font-mono text-xs">
            <button onclick="navigator.clipboard.writeText(document.getElementById('raw-key-{{ key_id }}').value).then(() => this.textContent='Copied!'); setTimeout(() => this.textContent='Copy', 2000)"
                    class="btn btn-ghost btn-sm">Copy</button>
        </div>
        <p class="text-xs text-error mt-2">Save this key now. It will not be shown again.</p>
    </div>
</div>
