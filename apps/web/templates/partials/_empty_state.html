<div class="card bg-base-100 shadow-lg">
    <div class="card-body items-center text-center py-12">
        <div class="text-5xl mb-4 opacity-30">{{ icon|default('📭') }}</div>
        <h3 class="text-lg font-semibold">{{ title|default('Nothing here yet') }}</h3>
        <p class="text-sm opacity-60 max-w-md">{{ message|default('') }}</p>
        {% if action_url and action_label %}
        <div class="card-actions mt-4">
            <a href="{{ action_url }}" class="btn btn-primary btn-sm">{{ action_label }}</a>
        </div>
        {% endif %}
    </div>
</div>
