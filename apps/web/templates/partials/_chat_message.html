<div class="chat {{ 'chat-end' if role == 'user' else 'chat-start' }}">
    <div class="chat-image avatar">
        <div class="w-10 rounded-full">
            {% if role == 'user' %}
            <div class="bg-primary text-primary-content flex items-center justify-center h-full">
                <span class="text-sm font-bold">{{ avatar|default('U') }}</span>
            </div>
            {% else %}
            <div class="bg-neutral text-neutral-content flex items-center justify-center h-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M2 5a2 2 0 012-2h12a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2V5zm3.293 1.293a1 1 0 011.414 0l3.293 3.293 3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
                </svg>
            </div>
            {% endif %}
        </div>
    </div>
    <div class="chat-bubble {{ 'chat-bubble-primary' if role == 'user' else '' }}">{{ content }}</div>
    {% if timestamp %}
    <div class="chat-footer text-xs opacity-50">{{ timestamp }}</div>
    {% endif %}
</div>
