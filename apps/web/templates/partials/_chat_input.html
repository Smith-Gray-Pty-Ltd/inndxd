<div class="bg-base-200 border-t border-base-300 p-4">
    <form hx-post="{{ post_url|default('/ui/chat/send') }}"
          hx-target="{{ target|default('#chat-messages') }}"
          hx-swap="beforeend"
          hx-on::after-request="this.reset()"
          class="flex items-end gap-2">
        <div class="flex-1">
            <textarea name="message"
                      class="textarea w-full resize-none"
                      rows="2"
                      placeholder="Type your message..."
                      required
                      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();this.form.requestSubmit()}"></textarea>
        </div>
        <div class="flex gap-1 flex-shrink-0">
            <button type="button" class="btn btn-ghost btn-circle btn-sm" title="Attach file" onclick="document.getElementById('chat-file-input').click()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
            </button>
            <input type="file" id="chat-file-input" name="file" class="hidden" multiple accept=".csv,.json,.png,.jpg,.jpeg,.gif,.webp">
            <button type="submit" class="btn btn-primary btn-circle btn-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
            </button>
        </div>
    </form>
</div>
