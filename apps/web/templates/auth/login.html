{% extends "base.html" %}
{% block title %}Login — Inndxd{% endblock %}
{% block page_title %}{% endblock %}
{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="card bg-base-100 shadow-xl w-full max-w-md">
        <div class="card-body">
            <h1 class="card-title text-2xl justify-center">Inndxd</h1>
            <p class="text-center text-base-content/60 mb-2">Sign in to your account</p>

            {% if error %}
            <div role="alert" class="alert alert-error">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/ui/auth/login">
                <fieldset class="fieldset">
                    <label class="fieldset-label">Email</label>
                    <input type="email" name="email" class="input w-full" placeholder="you@example.com" value="{{ email or '' }}" required autofocus>
                </fieldset>
                <fieldset class="fieldset mt-3">
                    <label class="fieldset-label">Password</label>
                    <input type="password" name="password" class="input w-full" placeholder="••••••••" required>
                </fieldset>
                <div class="card-actions mt-6">
                    <button type="submit" class="btn btn-primary w-full">Sign In</button>
                </div>
            </form>

            <p class="text-center text-sm text-base-content/60">
                No account? <a href="/ui/auth/register" class="link link-primary">Register</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
