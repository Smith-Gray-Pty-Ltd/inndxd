{% extends "base.html" %}
{% block title %}New Project — Inndxd{% endblock %}
{% block page_title %}New Project{% endblock %}
{% block content %}

<div class="max-w-lg mx-auto">
    <div class="card bg-base-100 shadow-sm">
        <div class="card-body">
            {% if error %}
            <div role="alert" class="alert alert-error mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/ui/projects/create">
                <fieldset class="fieldset">
                    <label class="fieldset-label">Project Name</label>
                    <input type="text" name="name" class="input w-full" placeholder="e.g. AI Research Tracking" value="{{ name or '' }}" required autofocus>
                </fieldset>
                <fieldset class="fieldset mt-3">
                    <label class="fieldset-label">Description <span class="text-base-content/40">(optional)</span></label>
                    <textarea name="description" class="textarea w-full" rows="3" placeholder="What is this project about?">{{ description or '' }}</textarea>
                </fieldset>
                <div class="card-actions mt-6">
                    <a href="/ui/projects" class="btn btn-ghost">Cancel</a>
                    <button type="submit" class="btn btn-primary">Create Project</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
