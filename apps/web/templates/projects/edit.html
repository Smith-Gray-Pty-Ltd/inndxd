{% extends "base.html" %}
{% block title %}Edit {{ project.name }} — Inndxd{% endblock %}
{% block page_title %}Edit Project{% endblock %}
{% block content %}

<div class="max-w-lg mx-auto">
    <div class="card bg-base-100 shadow-sm">
        <div class="card-body">
            <form method="POST" action="/ui/projects/{{ project.id }}/edit">
                <fieldset class="fieldset">
                    <label class="fieldset-label">Project Name</label>
                    <input type="text" name="name" class="input w-full" value="{{ project.name or '' }}" required autofocus>
                </fieldset>
                <fieldset class="fieldset mt-3">
                    <label class="fieldset-label">Description <span class="text-base-content/40">(optional)</span></label>
                    <textarea name="description" class="textarea w-full" rows="3" placeholder="What is this project about?">{{ project.description or '' }}</textarea>
                </fieldset>
                <div class="card-actions mt-6">
                    <a href="/ui/projects/{{ project.id }}" class="btn btn-ghost">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
