{% extends "base.html" %}
{% block title %}Add LLM Provider — Inndxd{% endblock %}
{% block page_title %}Add LLM Provider{% endblock %}
{% block content %}

<div class="max-w-lg mx-auto">
    <div class="card bg-base-100 shadow-sm">
        <div class="card-body">
            {% if error %}
            <div role="alert" class="alert alert-error mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/ui/admin/providers/create">
                <fieldset class="fieldset">
                    <label class="fieldset-label">Name <span class="text-error">*</span></label>
                    <input type="text" name="name" class="input w-full" placeholder="e.g. xAI Grok" value="{{ name or '' }}" required autofocus>
                </fieldset>
                <fieldset class="fieldset mt-3">
                    <label class="fieldset-label">Type</label>
                    <select name="provider_type" class="select w-full">
                        <option value="openai_compatible" selected>OpenAI Compatible</option>
                        <option value="anthropic">Anthropic</option>
                        <option value="ollama">Ollama</option>
                    </select>
                </fieldset>
                <fieldset class="fieldset mt-3">
                    <label class="fieldset-label">Base URL <span class="text-error">*</span></label>
                    <input type="url" name="base_url" class="input w-full" placeholder="https://api.x.ai/v1" value="{{ base_url or '' }}" required>
                </fieldset>
                <fieldset class="fieldset mt-3">
                    <label class="fieldset-label">API Key</label>
                    <input type="password" name="api_key" class="input w-full" placeholder="sk-..." value="{{ api_key or '' }}">
                </fieldset>
                <fieldset class="fieldset mt-3">
                    <label class="fieldset-label">Default Model <span class="text-error">*</span></label>
                    <input type="text" name="default_model" class="input w-full" placeholder="grok-3-mini" value="{{ default_model or '' }}" required>
                </fieldset>
                <fieldset class="fieldset mt-3">
                    <label class="fieldset-label">Available Models</label>
                    <input type="text" name="available_models" class="input w-full" placeholder="grok-3-mini,grok-3" value="{{ available_models or '' }}">
                    <span class="fieldset-label">Comma-separated list</span>
                </fieldset>
                <fieldset class="fieldset mt-3">
                    <label class="fieldset-label">Priority</label>
                    <input type="number" name="priority" class="input w-full" value="0" min="0">
                    <span class="fieldset-label">Higher priority providers are tried first</span>
                </fieldset>
                <div class="card-actions mt-6">
                    <a href="/ui/admin/providers" class="btn btn-ghost">Cancel</a>
                    <button type="submit" class="btn btn-primary">Add Provider</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
