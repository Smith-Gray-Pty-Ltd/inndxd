services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: inndxd
      POSTGRES_USER: inndxd
      POSTGRES_PASSWORD: inndxd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inndxd"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      INNDXD_DATABASE_URL: postgresql+asyncpg://inndxd:inndxd@postgres:5432/inndxd
      INNDXD_LLM_PROVIDER_NAME: grok
      INNDXD_LLM_BASE_URL: https://api.x.ai/v1
      INNDXD_LLM_MODEL: grok-3-mini
      INNDXD_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - venv_api:/app/.venv
    command: ["uv", "run", "uvicorn", "inndxd_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      INNDXD_DATABASE_URL: postgresql+asyncpg://inndxd:inndxd@postgres:5432/inndxd
      INNDXD_REDIS_URL: redis://redis:6379/0
      INNDXD_LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - venv_web:/app/.venv
    command: ["uv", "run", "uvicorn", "inndxd_web.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]

  celery_worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "inndxd_api.celery_app",
        "worker",
        "--loglevel=info",
        "--concurrency=4",
      ]
    environment:
      INNDXD_DATABASE_URL: postgresql+asyncpg://inndxd:inndxd@postgres:5432/inndxd
      INNDXD_LLM_PROVIDER_NAME: grok
      INNDXD_LLM_BASE_URL: https://api.x.ai/v1
      INNDXD_LLM_MODEL: grok-3-mini
      INNDXD_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - venv_celery:/app/.venv

volumes:
  pgdata:
  venv_api:
  venv_web:
  venv_celery:
